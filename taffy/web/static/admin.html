<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffb7d5">
<title>塔菲后台</title>
<link rel="icon" href="/static/avatar.jpg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin">

<header class="topbar">
  <img class="avatar" src="/static/avatar.jpg" alt="塔菲">
  <div class="who">
    <div class="name">塔菲后台</div>
    <div class="status" id="status">看看钥匙喵…</div>
  </div>
  <button type="button" id="logout" class="new-chat" hidden>退出</button>
</header>

<main class="admin-main">

  <section id="login-view" class="card" hidden>
    <h2>先登录喵</h2>
    <p class="hint">
      口令每天换一次，只有塔菲的主人知道喵。<br>
      怎么配、怎么算，见 README 的「后台管理」那一节。
    </p>
    <form id="login-form">
      <label>口令
        <input type="password" id="password" placeholder="当日口令"
               autocomplete="current-password">
      </label>
      <button type="submit">登录</button>
    </form>
  </section>

  <section id="panel-view" hidden>
    <div class="card">
      <h2>模型</h2>
      <label>聊天模型（纯文字那几轮）
        <input id="model" list="model-list" placeholder="deepseek-flash" autocomplete="off">
      </label>
      <label>图片模型（消息里带图片的那一轮）
        <input id="vision-model" list="model-list" placeholder="deepseek-flash" autocomplete="off">
      </label>
      <datalist id="model-list"></datalist>
      <button type="button" id="save-models">保存模型</button>
      <p class="hint" id="history-hint"></p>
      <div class="chips" id="history-chips"></div>
    </div>

    <div class="card">
      <h2>接口（聊天 / 图片各一套）</h2>

      <h3 class="sub">聊天</h3>
      <label>接口地址
        <input id="chat-base" autocomplete="off">
      </label>
      <label>Key
        <input type="password" id="chat-key" placeholder="留空不改动；填了就覆盖"
               autocomplete="new-password">
      </label>
      <p class="hint" id="chat-state"></p>

      <h3 class="sub">图片</h3>
      <label>接口地址
        <input id="vision-base" autocomplete="off">
      </label>
      <label>Key
        <input type="password" id="vision-key" placeholder="留空不改动；填了就覆盖"
               autocomplete="new-password">
      </label>
      <p class="hint" id="vision-state"></p>

      <button type="button" id="save-keys">保存接口设置</button>
      <p class="hint">
        两套互相独立：聊天用 GLM、图片用 DeepSeek 也行，各填各的 key 和地址。
        输入框留空表示「这项不改」，当前生效的值写在上面那行提示里。<br>
        存下来立刻生效不用重启；key 不回显，也不显示头尾。
      </p>
    </div>
  </section>

</main>

<script src="/static/admin.js"></script>
</body>
</html>
