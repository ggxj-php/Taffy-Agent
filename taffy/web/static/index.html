<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffb7d5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>永雏塔菲 · Agent</title>
<link rel="icon" href="/static/avatar.jpg">
<link rel="stylesheet" href="/static/vendor/highlight.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <img class="avatar" src="/static/avatar.jpg" alt="塔菲">
  <div class="who">
    <div class="name">永雏塔菲</div>
    <div class="status" id="status">在线喵</div>
  </div>
  <button type="button" id="save-session" class="new-chat ghost">保存上下文</button>
  <button type="button" id="new-chat" class="new-chat">新会话</button>
</header>

<main id="messages" class="messages"></main>

<button type="button" id="to-bottom" class="to-bottom" aria-label="回到最底部">
  <span aria-hidden="true">↓</span>
</button>

<div class="ctx-bar" id="ctx-bar" hidden>
  <span class="ctx-label">上下文</span>
  <span class="ctx-track"><span class="ctx-fill" id="ctx-fill"></span></span>
  <span class="ctx-text" id="ctx-text">0%</span>
</div>

<form id="composer" class="composer">
  <div class="attach-bar" id="attach-bar" hidden>
    <div class="attach-item">
      <img id="attach-preview" alt="待发送的图片">
      <button type="button" id="attach-remove" class="attach-remove" aria-label="移除图片">×</button>
    </div>
  </div>
  <div class="composer-row">
    <button type="button" id="pick-image" class="icon-btn" aria-label="发送图片" title="发送图片">🖼</button>
    <textarea id="input" rows="1" placeholder="和塔菲说点什么喵…" autocomplete="off"></textarea>
    <button id="send" type="submit" aria-label="发送">发送</button>
  </div>
  <input type="file" id="image-input" accept="image/*" hidden>
</form>

<div class="modal" id="save-modal" hidden>
  <div class="modal-box">
    <h3>保存这段上下文</h3>
    <p class="modal-hint">
      给这次存档起个名字（uuid），它会当成服务器上的文件名。<br>
      字母、数字和 <code>. _ -</code> 都行，3~64 位，开头得是字母或数字。<br>
      名字重了会被拒绝，<b>不会覆盖已经存好的那份</b>。
    </p>
    <input id="save-uuid" placeholder="例如 chat-2026-09-27-auth" autocomplete="off">
    <p class="modal-msg" id="save-msg"></p>
    <div class="modal-btns">
      <button type="button" id="save-cancel" class="modal-cancel">取消</button>
      <button type="button" id="save-ok">保存</button>
    </div>
  </div>
</div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
